<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dostana — Vendor & Kitchen Display System</title>
  <meta name="theme-color" content="#ea580c">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col">

  <!-- Kitchen Top Bar -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-orange-500 flex items-center justify-center font-extrabold text-white text-base shadow-sm">
        👨‍🍳
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-display font-extrabold text-lg text-white leading-none">DOSTANA KITCHEN</h1>
          <span class="text-[10px] uppercase tracking-wider font-extrabold bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-md">Live KDS</span>
        </div>
        <p class="text-[11px] text-slate-400">Independent Food Court Stall Order Management</p>
      </div>
    </div>

    <!-- Vendor Stall Selector Dropdown -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 shadow-inner">
        <label for="vendor-select" class="text-xs font-bold text-slate-400">Current Stall:</label>
        <select id="vendor-select" class="bg-transparent text-white font-bold text-sm focus:outline-none cursor-pointer">
          <option value="shawarma-hub" class="bg-slate-900 text-white">Shawarma Hub (SH)</option>
          <option value="dostana-tiffins" class="bg-slate-900 text-white">Dostana Tiffins (DT)</option>
          <option value="chai-adda" class="bg-slate-900 text-white">Chai Adda (CA)</option>
        </select>
      </div>

      <!-- Navigation Links -->
      <div class="flex items-center gap-1.5 bg-slate-800/80 p-1 rounded-xl border border-slate-700">
        <a href="/" class="px-3 py-1 text-xs font-semibold text-slate-300 hover:text-white rounded-lg transition-colors">Customer App</a>
        <a href="/vendor" class="px-3 py-1 text-xs font-bold bg-orange-500 text-white rounded-lg shadow-sm">Kitchen</a>
        <a href="/admin" class="px-3 py-1 text-xs font-semibold text-slate-300 hover:text-white rounded-lg transition-colors">Admin</a>
      </div>
    </div>
  </header>

  <!-- Stall Status & Stats Bar -->
  <section class="bg-slate-900/60 border-b border-slate-800/80 px-6 py-3 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <h2 id="active-stall-title" class="font-display font-extrabold text-white text-base">Shawarma Hub</h2>
      <span id="active-stall-code" class="text-xs font-mono font-bold bg-slate-800 text-orange-400 px-2 py-0.5 rounded border border-slate-700">#SH</span>
    </div>

    <!-- Counters -->
    <div class="flex items-center gap-3 text-xs">
      <div class="bg-blue-500/10 border border-blue-500/30 px-3 py-1 rounded-xl flex items-center gap-1.5">
        <span class="text-blue-400 font-bold">New:</span>
        <span id="count-new" class="font-mono font-black text-white bg-blue-500 px-1.5 py-0.2 rounded text-[11px]">0</span>
      </div>
      <div class="bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-xl flex items-center gap-1.5">
        <span class="text-amber-400 font-bold">Preparing:</span>
        <span id="count-preparing" class="font-mono font-black text-white bg-amber-500 px-1.5 py-0.2 rounded text-[11px]">0</span>
      </div>
      <div class="bg-emerald-500/10 border border-emerald-500/30 px-3 py-1 rounded-xl flex items-center gap-1.5">
        <span class="text-emerald-400 font-bold">Ready:</span>
        <span id="count-ready" class="font-mono font-black text-white bg-emerald-500 px-1.5 py-0.2 rounded text-[11px]">0</span>
      </div>
      <button onclick="loadVendorOrders()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-2.5 py-1 rounded-xl transition-colors font-medium">
        ↻ Refresh
      </button>
    </div>
  </section>

  <!-- Main Kanban Board -->
  <main class="flex-1 p-6 overflow-x-auto">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-7xl mx-auto min-w-[760px]">

      <!-- COLUMN 1: NEW INCOMING ORDERS -->
      <div class="bg-slate-900/80 rounded-2xl border border-slate-800 p-4 flex flex-col shadow-sm">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-500"></span>
            <h3 class="font-display font-bold text-sm tracking-wide text-white uppercase">1. New Tickets</h3>
          </div>
          <span class="text-[11px] text-slate-400 font-mono" id="col-count-new">0 tickets</span>
        </div>
        <div id="col-items-new" class="space-y-3 flex-1 overflow-y-auto max-h-[calc(100vh-250px)] pr-1">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- COLUMN 2: ACTIVELY PREPARING -->
      <div class="bg-slate-900/80 rounded-2xl border border-slate-800 p-4 flex flex-col shadow-sm">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-500"></span>
            <h3 class="font-display font-bold text-sm tracking-wide text-white uppercase">2. In Cooking</h3>
          </div>
          <span class="text-[11px] text-slate-400 font-mono" id="col-count-preparing">0 tickets</span>
        </div>
        <div id="col-items-preparing" class="space-y-3 flex-1 overflow-y-auto max-h-[calc(100vh-250px)] pr-1">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- COLUMN 3: READY FOR PICKUP -->
      <div class="bg-slate-900/80 rounded-2xl border border-slate-800 p-4 flex flex-col shadow-sm">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            <h3 class="font-display font-bold text-sm tracking-wide text-white uppercase">3. Ready at Counter</h3>
          </div>
          <span class="text-[11px] text-slate-400 font-mono" id="col-count-ready">0 tickets</span>
        </div>
        <div id="col-items-ready" class="space-y-3 flex-1 overflow-y-auto max-h-[calc(100vh-250px)] pr-1">
          <!-- Dynamically populated -->
        </div>
      </div>

    </div>
  </main>

  <script src="/static/js/vendor.js"></script>
</body>
</html>
